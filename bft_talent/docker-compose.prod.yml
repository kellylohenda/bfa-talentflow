services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-bfa_talentflow}
      DB_USERNAME: ${DB_USERNAME:-bfa}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      LOG_CHANNEL: stderr
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bfa-prod

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bfa_talentflow}
      MYSQL_USER: ${DB_USERNAME:-bfa}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bfa-prod

volumes:
  db-data:

networks:
  bfa-prod:
    driver: bridge
